name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install universal2 Python
        # setup-python 装的是单架构解释器，打出来的包只能跑一种芯片。
        # python.org 官方版自带 universal2，装它才能出一包两用。
        run: |
          set -e
          PY_VER="3.12.10"
          URL="https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
          curl -fsSL -o /tmp/python.pkg "$URL"
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 --version
          file /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
      - name: Install build deps
        run: |
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pip install --upgrade pip
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pip install pyinstaller pillow customtkinter
      - name: Build
        run: |
          export HEALTH_FLOAT_BUILD_PYTHON="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3"
          ./build_macos_app.sh
      - name: Make DMG
        run: |
          hdiutil create -volname "Health Float" -srcfolder "dist/Health Float.app" -ov -format UDZO "dist/Health Float.dmg"
          lipo -info "dist/Health Float.app/Contents/MacOS/Health Float"
          # 架构必须是 universal2 —— README 承诺「Intel + Apple Silicon 通用」。
          # lipo -info 只是打印，不会让 CI 失败，所以这里显式断言：
          # 单架构包发出去，Intel Mac 用户装完才发现打不开。
          ARCHS="$(lipo -archs "dist/Health Float.app/Contents/MacOS/Health Float")"
          echo "archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) echo "    [OK] universal2 双架构" ;;
            *) echo "[X] 不是 universal2（实际: $ARCHS）—— Intel Mac 用户无法运行"; exit 1 ;;
          esac
      - name: Verify package contents
        run: |
          # 产物自检：CTK 主题必须在（否则设置面板没有现代界面），
          # PIL 必须不在（它的单架构扩展会破坏 universal2 打包）。
          python3 scripts/verify_package.py "dist/Health Float.app"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthFloat-macOS
          path: dist/Health Float.dmg

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller customtkinter
      - name: Build
        shell: bash
        run: |
          # Git Bash 的 $(pwd) 是 MSYS 路径（/d/a/...），
          # 原生 Windows Python 无法解析 —— 用 Python 自己算绝对路径
          ASSETS="$(python -c "import os; print(os.path.abspath('assets'))")"
          echo "assets -> $ASSETS"
          # CustomTkinter 的主题 JSON 是数据文件。
          # PyInstaller 自带 hook-customtkinter.py 会收 collect_data_files，
          # 但那只管数据、不管 hiddenimports —— 显式 --collect-all 更稳，
          # 且和本地的 build_windows.sh / linux-installer.sh 保持一致。
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "Health Float" --distpath dist --workpath build --specpath build \
            --add-data "${ASSETS};assets" \
            --collect-all customtkinter \
            --exclude-module PIL \
            health_float.py
      - name: Zip
        shell: bash
        run: |
          # 用 Python 的 zipfile，不依赖 zip 命令（Windows runner 上不一定有）
          # zip 落在 dist/ 里，才能被 upload-artifact 的 dist/*.zip 找到
          #
          # 只打包 base_dir='Health Float'：如果直接打包整个 dist/，
          # 正在写入的 zip 会把自己也包进去（用户解压会看到一个
          # 几十字节的空壳 HealthFloat-Windows.zip）。
          python -c "import shutil; shutil.make_archive('dist/HealthFloat-Windows','zip', root_dir='dist', base_dir='Health Float')"
          ls -lh dist/*.zip
          python -c "import zipfile; z=zipfile.ZipFile('dist/HealthFloat-Windows.zip'); names=z.namelist(); print('entries:', len(names)); print('self-included:', [n for n in names if n.endswith('.zip') and 'base_library' not in n])"
      - name: Verify package contents
        shell: bash
        run: |
          # 产物自检：CTK 主题必须在（否则设置面板没有现代界面），
          # PIL 必须不在（它的单架构扩展会破坏 universal2 打包），
          # zip 不得自包含。这三条都是「不报错但结果不对」的坑。
          python3 scripts/verify_package.py dist/HealthFloat-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HealthFloat-Windows
          path: dist/*.zip

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller customtkinter
      - name: Build onefile
        run: |
          echo "跳过：AppImage 走 onedir，由 linux-installer.sh 负责"
      - name: Build AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils fuse libfuse2
          chmod +x linux-installer.sh
          # linux-installer.sh 内部自己做 onedir 打包，这里不要重复打
          ./linux-installer.sh
          ls -lh dist/
      - name: Verify package contents
        run: |
          # 产物自检：CTK 主题必须在（否则设置面板没有现代界面），
          # PIL 必须不在（单架构扩展会破坏 universal2 打包）。
          # 检查 onedir 目录（AppImage 是它的封装）。
          python3 scripts/verify_package.py dist/HealthFloat
      - uses: actions/upload-artifact@v4
        with:
          name: HealthFloat-Linux
          path: dist/*.AppImage

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来创建/推送 tag
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec mv {} release/ \;
          ls -lh release/
      - name: Ensure tag exists
        run: |
          TAG="${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          echo "tag: $TAG"
          git fetch --tags --force || true
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "created tag $TAG"
          else
            echo "tag $TAG already exists"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # 覆盖同名资产：三个平台的产物每次都从当前代码重新构建。
          # 早期用 false 是为了保住「手工上传的 universal2 DMG」——
          # 那个前提已经变了：
          #   1. CI 装的是 python.org 官方 universal2 Python，
          #      macOS 产物本身就是双架构（实测 x86_64 + arm64）；
          #   2. 手工上传的 DMG 反而是本机 arm64 单架构，
          #      Intel Mac 用户根本打不开。
          # 所以现在让 CI 的产物覆盖，才能把 universal2 和最新修复一起发出去。
          overwrite_files: true
          # workflow_dispatch 时没有 tag，必须显式指定；
          # push tag 时用触发该次运行的 tag
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body: |
            ## 🌿 大水大睡大健康 — Health Float

            下载对应你系统的版本，**双击即用，不需要装 Python**。

            | 系统 | 文件 | 说明 |
            |------|------|------|
            | macOS | `Health.Float.dmg` | 拖进「应用程序」，双击运行（Intel + Apple Silicon 通用）|
            | Windows | `HealthFloat-Windows.zip` | 解压后双击 `Health Float.exe` |
            | Linux | `Health.Float.AppImage` | `chmod +x` 后双击运行 |

            ### 第一次使用
            1. 双击打开
            2. 首次会弹出设置窗口，**用上下箭头**选好洗澡和睡觉时间
            3. 想开机自动运行（macOS）：系统设置 → 通用 → 登录项 → 添加 Health Float.app

            ### 找不到设置？
            点舷窗**右下角的 ⚙ 齿轮**，或**右键舷窗**打开快捷菜单。
