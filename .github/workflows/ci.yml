name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # ubuntu-latest 已升级到 26.04，官方不再提供 Python 3.9 构建
          # （setup-python 直接报 "The version '3.9' ... was not found for Ubuntu 26.04"）。
          # 3.9 的兼容性由 macOS / Windows 两个 runner 继续覆盖。
          - os: ubuntu-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Ubuntu 需要 Tcl/Tk 运行库和虚拟显示（headless X）
      # 关键：先验证再安装 —— setup-python 的解释器通常已带 _tkinter，
      # 但可能缺系统的 libtk/libtcl 动态库（这才是真正要装的）。
      - name: Ensure tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb libtk8.6 libtcl8.6
          # setup-python 的解释器通常自带 _tkinter 绑定，但可能缺系统的
          # libtk/libtcl 动态库 —— 那才是要装的。先验证再决定要不要装包。
          if ! python -c "import tkinter" >/dev/null 2>&1; then
            echo "tkinter 模块缺失，尝试安装系统包"
            sudo apt-get install -y "python${{ matrix.python }}-tk" || \
            sudo apt-get install -y python3-tk || true
          fi
          python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"
          # 建窗口必须要有 X server，所以这一步要跑在 xvfb 下
          xvfb-run -a python -c "import tkinter; r=tkinter.Tk(); r.update(); r.destroy(); print('窗口创建 OK')"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile health_float.py tests/test_health_float.py
