name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Ubuntu 需要 tkinter 和虚拟显示（headless X）
      # 注意：setup-python 装的是自带版本，必须用 pip 装 tkinter 绑定
      # （apt 的 python3-tk 只对应系统 Python，对 3.9/3.13 无效）
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libtk8.6 libtcl8.6
          # setup-python 的解释器自己找 tkinter 绑定
          python -c "import tkinter" 2>/dev/null || \
            sudo apt-get install -y "python${{ matrix.python }}-tk" || true
          python -c "import tkinter; tkinter.Tk().destroy()" || \
            (echo "tkinter 不可用，安装失败"; exit 1)

      - name: Run tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile health_float.py tests/test_health_float.py
